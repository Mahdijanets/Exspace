<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Akustik: Space Flight</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #05061a; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden;
         font-family: "Comic Sans MS", "Comic Neue", cursive, sans-serif; user-select: none; touch-action: none; }
  #wrap { position: relative; height: min(100vh, 800px); aspect-ratio: 2 / 3; max-width: 100vw; }
  canvas { width: 100%; height: 100%; display: block; border-radius: 8px; box-shadow: 0 0 30px rgba(40,120,255,.4); }
  .screen { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center;
            gap: 14px; background: rgba(6,10,35,.8); border-radius: 8px; color: #dff6ff; text-align: center; padding: 20px; }
  .hidden { display: none; }
  h1 { font-size: 46px; color: #5ff2ff; text-shadow: 0 0 12px #2f8cff, 3px 3px 0 #12307a; }
  h2 { font-size: 36px; color: #ff6b8b; text-shadow: 0 0 10px #ff2d55; }
  p { font-size: 18px; }
  .hint { font-size: 14px; opacity: .85; line-height: 1.5; }
  button { font-family: inherit; font-size: 22px; padding: 10px 32px; cursor: pointer; background: #2f7bff; color: #fff;
           border: 3px solid #5ff2ff; border-radius: 14px; box-shadow: 0 5px 0 #12307a, 0 0 16px #2fb8ff; }
  button:active { transform: translateY(4px); box-shadow: 0 1px 0 #12307a; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="400" height="600"></canvas>
  <div id="menu" class="screen">
    <h1>Akustik</h1>
    <p>Space Flight</p>
    <p>Dodge the asteroids and aliens<br>and reach the galaxy!</p>
    <button id="startBtn">Start!</button>
    <div class="hint">← → or A/D — left / right<br>↑ or W — boost, ↓ or S — brake<br>Mouse / finger — move above Akustik to boost<br>P — pause</div>
    <p id="menuBest"></p>
  </div>
  <div id="win" class="screen hidden">
    <h1>Victory!</h1>
    <p>Akustik flew across the whole Solar System and reached the galaxy!</p>
    <p id="winTime"></p>
    <button id="winBtn">Fly again</button>
  </div>
  <div id="over" class="screen hidden">
    <h2>Akustik got hit!</h2>
    <p id="finalScore"></p>
    <p id="bestScore"></p>
    <button id="restartBtn">Try again</button>
  </div>
</div>

function bands(x, y, r, list, wave) {
  const t = Date.now() / 1500;
  for (const [pos, h, c] of list) {
    ctx.fillStyle = c; ctx.beginPath();
    const by = y + pos * r;
    ctx.moveTo(x - r, by);
    for (let bx = -r; bx <= r; bx += 8) ctx.lineTo(x + bx, by + Math.sin(bx / 14 + t + pos * 9) * wave);
    for (let bx = r; bx >= -r; bx -= 8) ctx.lineTo(x + bx, by + h * r + Math.sin(bx / 11 + t * 1.3 + pos * 5) * wave);
    ctx.fill();
  }
}
function moonlet(cx, cy, dist, size, speedK, phase, color, tilt = 0.25) {
  const a = Date.now() / 1000 * speedK + phase;
  const mx = cx + Math.cos(a) * dist, my = cy + Math.sin(a) * dist * tilt;
  if (Math.sin(a) < 0) return () => ball(mx, my, size, '#fff', color);
  ball(mx, my, size, '#fff', color); return () => {};
}

// ---------- Earth seen from space ----------
const er = seeded(23);
const CONTINENTS = Array.from({ length: 9 }, () => ({ a: er() * Math.PI * 2, d: er() * 0.8, s: 0.15 + er() * 0.25,
  blobs: Array.from({ length: 5 }, () => [er() - 0.5, er() - 0.5, 0.3 + er() * 0.5]) }));
const EARTH_CLOUDS = Array.from({ length: 14 }, () => [er() * 2 - 1, er() * 2 - 1, 0.06 + er() * 0.1]);
function drawEarthGlobe() {
  const t = clamp((alt - 350) / 9000, 0, 1);
  if (t <= 0 || t >= 1) return;
  const e = 1 - Math.pow(1 - t, 2);
  const r = lerp(650, 55, e);
  const cy = H + r - lerp(70, -40, t) ;
  const x = W / 2;
  ctx.save(); ctx.globalAlpha = clamp(spaceAmount() * 1.5, 0, 1);
  glow(x, cy, r, 'rgba(110,180,255,.55)', 1 + 30 / r + 0.05);
  ball(x, cy, r, '#5fb6ff', '#0d3a8a');
  ctx.save(); clipCircle(x, cy, r);
  const rot = Date.now() / 30000;
  ctx.fillStyle = '#4caf50';
  for (const c of CONTINENTS) {
    const cx = x + Math.cos(c.a + rot) * c.d * r, ccy = cy + Math.sin(c.a) * c.d * r * 0.8;
    for (const [bx, by, br] of c.blobs) { ctx.beginPath(); ctx.arc(cx + bx * c.s * r, ccy + by * c.s * r, br * c.s * r * 0.6, 0, Math.PI * 2); ctx.fill(); }
  }
  ctx.fillStyle = 'rgba(210,180,110,.5)';
  for (const c of CONTINENTS.slice(0, 3)) { ctx.beginPath(); ctx.arc(x + Math.cos(c.a + rot) * c.d * r, cy + Math.sin(c.a) * c.d * r * 0.8, c.s * r * 0.2, 0, Math.PI * 2); ctx.fill(); }
  ctx.fillStyle = 'rgba(255,255,255,.75)';
  for (const [cx, ccy, cr] of EARTH_CLOUDS) {
    ctx.beginPath(); ctx.ellipse(x + cx * r + Math.sin(rot * 3 + cx) * 10, cy + ccy * r, cr * r * 1.6, cr * r * 0.5, 0.2, 0, Math.PI * 2); ctx.fill();
  }
  ctx.fillStyle = 'rgba(255,255,255,.95)'; ctx.beginPath(); ctx.ellipse(x, cy - r + 4, r * 0.35, r * 0.07, 0, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  shade(x, cy, r, 'rgba(180,230,255,.8)');
  if (r < 300) {
    ctx.fillStyle = 'rgba(255,255,255,.75)'; ctx.font = '16px "Comic Sans MS", cursive'; ctx.textAlign = 'center';
    ctx.fillText('Earth', x, cy - r - 12);
  }
  ctx.restore();
}

function panel(x, y, w, h) {
  ctx.fillStyle = '#1c3f9e'; ctx.fillRect(x, y, w, h);

function drawSat(sa) {

function drawBackground() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, rgb(skyColor(alt + H))); g.addColorStop(1, rgb(skyColor(alt)));
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

      ctx.fillStyle = `rgba(255,255,255,${s.z * sp})`;
      ctx.fillRect(s.x, s.y, s.z * 2, s.z * 2 + Math.max(0, speed - 5) * s.z * 2.2);
    }
  }
  drawSun();
  drawEarthGlobe();
  for (const p of PLANETS) {
    const y = H / 2 + (alt - p.a) * 0.12;
    if (y < -p.r * 2.3 - 30 || y > H + p.r * 2.3) continue;

    ctx.fillText(p.name, p.x, y + p.r + (p.name === 'Saturn' ? 40 : 24));

function drawRocket() {

    const jr = 22 * (1 + Math.max(0, boost) * 0.9) * (0.9 + Math.random() * 0.2);
    const g = ctx.createRadialGradient(jx, jy, 2, jx, jy + jr * 0.4, jr);
    g.addColorStop(0, 'rgba(160,255,255,.7)'); g.addColorStop(1, 'rgba(0,150,255,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(jx, jy + jr * 0.4, jr * 0.7, jr * 1.2, 0, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
  if (craft.complete) ctx.drawImage(craft, f * CW, row * CH, CW, CH, x - CW * CS / 2, y - CH * CS / 2, CW * CS, CH * CS);
}

const ALIEN_TYPES = ['ufo', 'blob', 'squid'];
function spawnAlien() {
  const d = prog();

  aliens.push({ type, x: rand(40, W - 40), baseX: 0, y: -40, t: rand(0, 6), r: type === 'squid' ? 22 : 20, cd: rand(60, 120) });
  aliens[aliens.length - 1].baseX = aliens[aliens.length - 1].x;
}
function updateAlien(a) {
  a.t += 0.04;
  if (a.type === 'ufo') { a.x = a.baseX + Math.sin(a.t * 2) * (40 + 50 * prog()); a.y += speed * 0.5 + 0.8; }
  if (a.type === 'blob') { a.x += clamp(rocket.x - a.x, -1, 1) * (0.4 + 0.8 * prog()); a.y += speed * 0.45 + 0.8; }
  if (a.type === 'squid') {
    a.x = a.baseX + Math.sin(a.t) * 40; a.y += speed * 0.35 + 0.6;

      shots.push({ x: a.x, y: a.y + 15, vx: Math.cos(ang) * v, vy: Math.sin(ang) * v + speed * 0.3 });
    }
  }

}

// ---------- Controls ----------
document.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code.startsWith('Arrow') || e.code === 'Space') e.preventDefault();
  if (e.code === 'KeyP' && state === 'play') paused = !paused;
  if (e.code === 'Enter' && state !== 'play') start();
});
document.addEventListener('keyup', e => { keys[e.code] = false; });
function setPointer(e) {
  const rect = canvas.getBoundingClientRect();
  const t = e.touches ? e.touches[0] : e;
  if (!t) return;
  pointer = { x: (t.clientX - rect.left) / rect.width * W, y: (t.clientY - rect.top) / rect.height * H };
}
canvas.addEventListener('mousemove', setPointer);
canvas.addEventListener('mouseleave', () => pointer = null);
canvas.addEventListener('touchstart', e => { e.preventDefault(); setPointer(e); }, { passive: false });
canvas.addEventListener('touchmove', e => { e.preventDefault(); setPointer(e); }, { passive: false });
canvas.addEventListener('touchend', () => pointer = null);

// ---------- Game ----------
function init() {
  rocket = { x: W / 2 + 10, y: H - 100, vx: 0, vy: 0, tilt: 0 };
  sats = []; satTimer = rand(600, 900);
  asteroids = []; aliens = []; shots = []; particles = [];
  alt = 0; speed = 0; boost = 0; lives = 3; invuln = 0; launchT = 180; frame = 0; nextPlanet = 0; banner = null; winT = 0;
}

function boom(x, y, n, colors) {
  for (let i = 0; i < n; i++) {
    const ang = rand(0, Math.PI * 2), sp = rand(1, 5);
    particles.push({ x, y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, life: rand(20, 45), color: colors[i % colors.length], r: rand(2, 4) });
  }
}

function hitRocket(x, y, r) {
  for (const [ox, oy, rr] of [[0, -24, 16], [-28, 12, 11], [0, 12, 16], [28, 12, 11]]) {
    const dx = x - (rocket.x + ox), dy = y - (rocket.y + oy);
    if (dx * dx + dy * dy < (r + rr) * (r + rr) * 0.7) return true;
  }
  return false;
}

function damage() {
  if (invuln > 0) return;
  lives--; invuln = 100;
  boom(rocket.x, rocket.y, 25, ['#ffb02e', '#ff5d2e', '#fff']);
  if (lives <= 0) gameOver();
}

function update() {
  frame++;
  if (launchT > 0) {
    // countdown and liftoff
    launchT--;
    if (launchT < 60) { speed = lerp(speed, 4, 0.05); alt += speed; }
    if (frame % 3 === 0) particles.push({ x: rocket.x + rand(-25, 25), y: rocket.y + 45, vx: rand(-2, 2), vy: rand(-1, 0.5), life: 50, color: 'rgba(220,220,220,.8)', r: rand(5, 10) });
  } else {
    const d = prog();
    // ↑ boosts: Akustik stays almost in place while the world rushes down faster
    let thr = 0;
    if (keys.ArrowUp || keys.KeyW) thr += 1;
    if (keys.ArrowDown || keys.KeyS) thr -= 1;
    const acc = 0.7;
    let ax = 0;
    if (keys.ArrowLeft || keys.KeyA) ax -= acc;
    if (keys.ArrowRight || keys.KeyD) ax += acc;
    if (pointer && !ax && !thr) {
      ax = clamp((pointer.x - rocket.x) * 0.02, -acc, acc);
      thr = clamp((HOME_Y - pointer.y) / 150, -1, 1);
    }
    boost = lerp(boost, thr, 0.08);
    const base = 3 + 5 * d;
    speed = base * (boost > 0 ? 1 + boost * 2 : 1 + boost * 0.55);
    alt += speed;
    rocket.vx = (rocket.vx + ax) * 0.88;
    rocket.x = clamp(rocket.x + rocket.vx, 40, W - 40);
    rocket.y = lerp(rocket.y, HOME_Y - boost * 40, 0.06);
    rocket.tilt = rocket.vx * 0.05;

    // difficulty grows smoothly from Earth to the galaxy
    const calm = alt > GAL - 4000;
    if (!calm && alt > 400 && Math.random() < 0.009 + 0.046 * d) spawnAsteroid();
    if (!calm && alt > PLANETS[0].a && Math.random() < 0.002 + 0.01 * d) spawnAlien();

    if (nextPlanet < PLANETS.length && alt >= PLANETS[nextPlanet].a) {
      const bonus = lives < 3;
      if (bonus) lives++;
      banner = { text: PLANETS[nextPlanet].name + ' cleared!' + (bonus ? ' +♥' : ''), t: 150 };
      nextPlanet++;
      if (nextPlanet === PLANETS.length) setTimeout(() => { if (state === 'play') banner = { text: 'Galaxy ahead!', t: 180 }; }, 2600);
    }
    if (alt >= GAL) return win();
  }

  for (const s of stars) { s.y += speed * s.z * 0.6; if (s.y > H) { s.y = -2; s.x = rand(0, W); } }
  if (launchT <= 0 && spaceAmount() > 0.3 && --satTimer <= 0) { spawnSat(); satTimer = rand(1200, 1800); }
  for (const sa of sats) { sa.x += sa.vx; sa.y += sa.vy + speed * 0.04; sa.rot += sa.vr; }
  sats = sats.filter(sa => sa.x > -260 && sa.x < W + 260 && sa.y < H + 80);

  for (const a of asteroids) {
    a.x += a.vx; a.y += a.vy + speed; a.rot += a.vr;
    if (hitRocket(a.x, a.y, a.r * 0.85)) { a.dead = true; boom(a.x, a.y, 15, ['#7d6a58', '#a58e78']); damage(); }
  }
  for (const a of aliens) {
    updateAlien(a);
    if (hitRocket(a.x, a.y, a.r)) { a.dead = true; boom(a.x, a.y, 15, ['#7dff6a', '#b06fd8']); damage(); }
  }
  for (const s of shots) {
    s.x += s.vx; s.y += s.vy;
    if (hitRocket(s.x, s.y, 6)) { s.dead = true; damage(); }
  }
  asteroids = asteroids.filter(a => !a.dead && a.y < H + 60);
  aliens = aliens.filter(a => !a.dead && a.y < H + 60);
  shots = shots.filter(s => !s.dead && s.y < H + 20 && s.y > -20 && s.x > -20 && s.x < W + 20);

  // engine exhaust
  if (launchT <= 0 && frame % 2 === 0)
    for (const jx of [-27, 27]) for (let k = 0; k < (boost > 0.4 ? 2 : 1); k++) particles.push({ x: rocket.x + jx + rand(-3, 3), y: rocket.y + 48, vx: rand(-0.4, 0.4), vy: speed * 0.6 + 1.5, life: 20, color: 'rgba(110,240,255,.6)', r: rand(1.5, 3) });
  for (const p of particles) { p.x += p.vx; p.y += p.vy; p.life--; }
  particles = particles.filter(p => p.life > 0);

  if (invuln > 0) invuln--;
  if (banner && --banner.t <= 0) banner = null;
}

function drawHUD() {
  ctx.fillStyle = 'rgba(10,15,40,.5)'; ctx.fillRect(0, 0, W, 40);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 20px "Comic Sans MS", cursive'; ctx.textAlign = 'left';
  ctx.fillText(km() + ' km', 12, 27);
  if (state === 'play' && launchT <= 0) {
    ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.font = 'bold 14px "Comic Sans MS", cursive';
    ctx.fillText('Speed: ' + Math.round(speed * 3) + ' km/s', 12, 60);
  }
  if (boost > 0.3 && state === 'play') {
    ctx.fillStyle = '#5ff2ff'; ctx.font = 'bold 14px "Comic Sans MS", cursive';
    ctx.fillText('⚡ BOOST', 12, 80);
    ctx.fillStyle = '#fff';
  } else if (boost < -0.3 && state === 'play') {
    ctx.fillStyle = '#ffb02e'; ctx.font = 'bold 14px "Comic Sans MS", cursive';
    ctx.fillText('Brake', 12, 80);
    ctx.fillStyle = '#fff';
  }
  ctx.font = 'bold 20px "Comic Sans MS", cursive';
  ctx.textAlign = 'right'; ctx.fillStyle = '#ff4d6d';
  const hl = clamp(lives, 0, 3); ctx.fillText('♥'.repeat(hl) + '♡'.repeat(3 - hl), W - 12, 27);
  // progress bar Earth → galaxy
  const bx = 118, bw = W - 210, by = 17;
  ctx.fillStyle = 'rgba(255,255,255,.2)'; ctx.fillRect(bx, by, bw, 6);
  ctx.fillStyle = '#5ff2ff'; ctx.fillRect(bx, by, bw * prog(), 6);
  for (const p of PLANETS) { ctx.fillStyle = p.c1; ctx.beginPath(); ctx.arc(bx + bw * p.a / GAL, by + 3, 4, 0, Math.PI * 2); ctx.fill(); }
  ctx.fillStyle = '#ffd6f5'; ctx.beginPath(); ctx.arc(bx + bw, by + 3, 6, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(bx + bw * prog(), by + 3, 3, 0, Math.PI * 2); ctx.fill();
  if (banner) {
    ctx.globalAlpha = Math.min(1, banner.t / 30);
    ctx.fillStyle = '#ffd23f'; ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.lineWidth = 4; ctx.textAlign = 'center';
    ctx.font = 'bold 28px "Comic Sans MS", cursive';
    ctx.strokeText(banner.text, W / 2, 110); ctx.fillText(banner.text, W / 2, 110);
    ctx.globalAlpha = 1;
  }
  if (launchT > 60) {
    const n = Math.ceil((launchT - 60) / 40);
    ctx.fillStyle = '#fff'; ctx.strokeStyle = 'rgba(0,0,0,.5)'; ctx.lineWidth = 5; ctx.textAlign = 'center';
    ctx.font = 'bold 80px "Comic Sans MS", cursive';
    ctx.strokeText(n, W / 2, H / 2 - 60); ctx.fillText(n, W / 2, H / 2 - 60);
  } else if (launchT > 0) {
    ctx.fillStyle = '#ffd23f'; ctx.textAlign = 'center'; ctx.font = 'bold 50px "Comic Sans MS", cursive';
    ctx.fillText('Liftoff!', W / 2, H / 2 - 60);
  }
  if (paused) {
    ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.font = 'bold 40px "Comic Sans MS", cursive';
    ctx.fillText('Paused', W / 2, H / 2);
  }
}

const SPEED_LINES = Array.from({ length: 22 }, () => ({ x: rand(0, W), y: rand(0, H), l: rand(30, 90) }));
function drawSpeedLines() {
  if (boost < 0.15 || state !== 'play') return;
  ctx.strokeStyle = `rgba(200,240,255,${Math.min(0.5, boost * 0.5)})`; ctx.lineWidth = 1.5;
  ctx.beginPath();
  for (const l of SPEED_LINES) {
    l.y += speed * 3; if (l.y > H + l.l) { l.y = -l.l; l.x = rand(0, W); }
    ctx.moveTo(l.x, l.y); ctx.lineTo(l.x, l.y - l.l * boost);
  }
  ctx.stroke();
}
function draw() {
  drawBackground();
  drawSpeedLines();
  for (const a of asteroids) drawAsteroid(a);
  for (const a of aliens) drawAlien(a);
  for (const s of shots) {
    ctx.fillStyle = '#ff5dd8'; ctx.shadowColor = '#ff5dd8'; ctx.shadowBlur = 10;
    ctx.beginPath(); ctx.arc(s.x, s.y, 5, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0;
  }
  for (const p of particles) {
    ctx.globalAlpha = Math.min(1, p.life / 25); ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  if (lives > 0) drawRocket();
  if (state === 'menu') return;
  drawHUD();
}

let last = 0, accT = 0;
const STEP = 1000 / 60;
function loop(t) {
  if (!last) last = t;
  accT += Math.min(t - last, 100); last = t;
  while (accT >= STEP) { if (state === 'play' && !paused) update(); else if (state === 'win') updateWin(); accT -= STEP; }
  draw();
  requestAnimationFrame(loop);
}

function win() {
  state = 'win'; winT = 0; banner = null;
  for (const a of asteroids.concat(aliens)) boom(a.x, a.y, 10, ['#fff', '#ffd6f5', '#5ff2ff']);
  asteroids = []; aliens = []; shots = [];
  const t = Math.round((Date.now() - startTime) / 1000);
  document.getElementById('winTime').textContent = 'Flight time: ' + Math.floor(t / 60) + ' min ' + (t % 60) + ' sec, lives left: ' + lives;
}
function updateWin() {
  winT++; alt += speed;
  for (const s of stars) { s.y += speed * s.z; if (s.y > H) { s.y = -2; s.x = rand(0, W); } }
  rocket.x = lerp(rocket.x, W / 2, 0.05); rocket.vx *= 0.9;
  if (winT > 60) rocket.y -= (winT - 60) * 0.15;
  if (winT % 8 === 0) boom(rand(40, W - 40), rand(80, H - 200), 20, ['#ff4d6d', '#ffd23f', '#5ff2ff', '#7dff6a', '#ff5dd8']);
  for (const p of particles) { p.x += p.vx; p.y += p.vy; p.life--; }
  particles = particles.filter(p => p.life > 0);
  if (winT === 150) document.getElementById('win').classList.remove('hidden');
}
let startTime = 0;
function start() {
  init(); state = 'play'; paused = false; startTime = Date.now();
  document.getElementById('win').classList.add('hidden');
  document.getElementById('menu').classList.add('hidden');
  document.getElementById('over').classList.add('hidden');
}
function gameOver() {
  state = 'over';
  if (km() > best) { best = km(); localStorage.setItem('akustikRocketBest', best); }
  setTimeout(() => {
    document.getElementById('finalScore').textContent = 'Distance: ' + km() + ' km';
    document.getElementById('bestScore').textContent = 'Best: ' + best + ' km';
    document.getElementById('over').classList.remove('hidden');
  }, 300);
}
document.getElementById('startBtn').onclick = start;
document.getElementById('restartBtn').onclick = start;
document.getElementById('winBtn').onclick = start;
init();
requestAnimationFrame(loop);
</script>
</body>
</html>
