  <main class="main"><section class="form-card panel"><p class="eyebrow">Optional account</p><h2>Sign in</h2><p class="form-note">Only a nickname and password are used. Guest mode keeps working without an account.</p><form id="login-form"><div class="field"><label for="username">Nickname</label><input id="username" name="username" required maxlength="40" autocomplete="username"></div><div class="field"><label for="password">Password</label><input id="password" name="password" type="password" required maxlength="128" autocomplete="current-password"></div><button class="btn primary" type="submit">Sign in</button><p id="message" class="notice" hidden></p></form><p class="form-note">No account? <a href="register.html">Create one</a>.</p></section></main>
