<svg xmlns="http://www.w3.org/2000/svg" width="600" height="700" viewBox="0 0 600 700"><style>
.bob{animation:bob 3s ease-in-out infinite;transform-origin:300px 640px}
.ant{animation:ant 3s ease-in-out infinite;transform-origin:300px 175px}
.eyes{animation:blink 4.5s infinite;transform-origin:300px 296px}
.tip{animation:tip 1.6s ease-in-out infinite}
.waves path{animation:wave 1.2s ease-in-out infinite}
.waves path:nth-child(2){animation-delay:.15s}.waves path:nth-child(3){animation-delay:.3s}
.dots circle{animation:dot 1.2s ease-in-out infinite}
.dots circle:nth-child(2){animation-delay:.2s}.dots circle:nth-child(3){animation-delay:.4s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes ant{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes tip{0%,100%{fill:#7b5cff}50%{fill:#b39cff}}
@keyframes wave{0%,100%{opacity:.15}50%{opacity:1}}
@keyframes dot{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
